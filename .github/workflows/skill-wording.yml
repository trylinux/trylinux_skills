name: skill-wording
on:
  pull_request:
    paths: ["skills/**", "scripts/check_skill_wording.py"]
  push:
    branches: [main]
    paths: ["skills/**", "scripts/check_skill_wording.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_skill_wording.py
